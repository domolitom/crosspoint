name: publish

on:
  # Every run packs and installs the tarballs; only a tag run publishes them.
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # provenance is signed against the workflow identity

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      # Node 22 ships npm 10, and trusted publishing needs 11.5.1+.
      - run: npm install -g npm@latest

      - run: npm ci

      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for pkg in . packages/core packages/mcp; do
            have=$(node -p "require('./$pkg/package.json').version")
            [ "$have" = "$tag" ] || {
              echo "$pkg is $have, tag is $tag"; exit 1;
            }
          done

      # `npm publish` succeeding says nothing about whether the tarball runs. Tests are
      # test.yml's job; this proves the packages install and start.
      - name: Pack and install the tarballs
        run: |
          mkdir -p /tmp/pub
          npm pack --pack-destination /tmp/pub -w @crosspoint/core
          npm pack --pack-destination /tmp/pub -w @crosspoint/mcp
          npm pack --pack-destination /tmp/pub

          mkdir -p /tmp/consumer && cd /tmp/consumer
          npm init -y >/dev/null
          npm i --no-audit --no-fund \
            /tmp/pub/crosspoint-core-*.tgz \
            /tmp/pub/crosspoint-mcp-*.tgz \
            /tmp/pub/crosspoint-0.*.tgz

      - name: Smoke test the installed CLI
        run: |
          cd /tmp/consumer
          mkdir -p project && cd project
          CROSSPOINT_PORT=4400 ../node_modules/.bin/crosspoint > /tmp/cli.log 2>&1 &

          trap 'echo "--- cli log ---"; cat /tmp/cli.log || true' EXIT

          for i in $(seq 30); do
            curl -sf http://localhost:4400/api/graph >/dev/null && break
            sleep 1
          done

          curl -sf http://localhost:4400/ | grep -q '<div id="root"'
          curl -s -X POST http://localhost:4400/api/op \
            -H 'Content-Type: application/json' \
            -d '{"op":{"op":"add_node","label":"Smoke"}}' >/dev/null
          sleep 2
          grep -q Smoke .crosspoint/graph.json

      - name: Smoke test the installed MCP server
        run: |
          cd /tmp/consumer
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | node_modules/.bin/crosspoint-mcp | grep -q '"name":"get_graph"'

      # No token: npm authenticates the workflow's OIDC identity against the trusted
      # publisher configured on each package. Core first, since the CLI depends on it.
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          npm publish -w @crosspoint/core
          npm publish -w @crosspoint/mcp
          npm publish
