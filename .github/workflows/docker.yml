name: docker

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Build once into the local daemon so the smoke test runs the exact image that ships.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: crosspoint:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The canvas has no error surface, so building is not evidence that it serves.
      - name: Smoke test
        run: |
          # The image runs as uid 1000, and a bind mount keeps the host's ownership. The
          # runner checks out as a different uid, so without this the server cannot write
          # its diagrams and dies on startup — which surfaces only as a refused connection.
          mkdir -p /tmp/diagrams
          sudo chown 1000:1000 /tmp/diagrams

          docker run -d --name cp -p 4000:4000 -v /tmp/diagrams:/diagrams crosspoint:ci

          # Say what the server said however this exits. Without it a failure to start is a
          # bare `exit 7` from curl and the reason is never printed.
          trap 'echo "--- container log ---"; docker logs cp || true; docker rm -f cp || true' EXIT

          for i in $(seq 30); do
            curl -sf http://localhost:4000/api/graph >/dev/null && break
            sleep 1
          done

          curl -sf http://localhost:4000/ >/dev/null
          curl -sf http://localhost:4000/api/graph >/dev/null
          curl -s -X POST http://localhost:4000/api/op \
            -H 'Content-Type: application/json' \
            -d '{"op":{"op":"add_node","label":"Smoke"}}' >/dev/null
          sleep 2
          grep -q Smoke /tmp/diagrams/graph.json

      - name: Log in to ghcr.io
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        if: github.event_name == 'push'
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # `latest` is what an untagged `docker run` resolves to, so without it the command
          # in the README fails with `manifest unknown`.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Push
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
