name: docker

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Build once into the local daemon so the smoke test runs the exact image that ships.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: crosspoint:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The canvas has no error surface, so building is not evidence that it serves.
      - name: Smoke test
        run: |
          mkdir -p /tmp/diagrams
          docker run -d --name cp -p 4000:4000 -v /tmp/diagrams:/diagrams crosspoint:ci
          for i in $(seq 30); do
            curl -sf http://localhost:4000/api/graph >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:4000/ >/dev/null
          curl -sf http://localhost:4000/api/graph >/dev/null
          curl -s -X POST http://localhost:4000/api/op \
            -H 'Content-Type: application/json' \
            -d '{"op":{"op":"add_node","label":"Smoke"}}' >/dev/null
          sleep 2
          grep -q Smoke /tmp/diagrams/graph.json
          docker logs cp
          docker rm -f cp

      - name: Log in to ghcr.io
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        if: github.event_name == 'push'
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Push
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
